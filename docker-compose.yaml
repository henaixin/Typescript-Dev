version: "3.9"

# ================================================================
# 使用说明：
#   1. 确保镜像已通过 docker load / docker pull 加载到本地
#   2. 根据宿主机架构修改下方 image 字段为你的镜像名
#   3. 根据宿主机架构选择对应的 profile 启动：
#      - x86_64 架构：docker compose --profile x64 up
#      - ARM64  架构：docker compose --profile arm64 up
#   4. 如需修改时区、容器名等，直接编辑本文件对应字段
# ================================================================

x-common: &common
  # 请替换为实际加载的镜像名称
  image: typescript-demo:latest
  container_name: typescript-demo
  restart: always
  stdin_open: true   # 对应 -i，保持 stdin 打开（程序需要读取键盘输入）
  tty: true          # 对应 -t，分配伪终端
  environment:
    - TZ=Asia/Shanghai
  # 如需暴露端口（程序未来扩展网络功能时），取消下面注释并修改端口号：
  # ports:
  #   - "3000:3000"

services:
  # ========================================================
  # Profile: x64（x86_64 架构：Intel/AMD CPU 的 Linux/Mac/Windows）
  # 用法：docker compose --profile x64 up
  # ========================================================
  app-x64:
    <<: *common
    profiles:
      - x64
    volumes:
      # 左侧为宿主机上的二进制文件路径，右侧为容器内挂载路径（只读）
      - ./build/typescript-demo-linux-x64:/app/app:ro
    command: ["/app/app"]

  # ========================================================
  # Profile: arm64（ARM64 架构：Apple Silicon Mac、树莓派、ARM 服务器等）
  # 用法：docker compose --profile arm64 up
  # ========================================================
  app-arm64:
    <<: *common
    profiles:
      - arm64
    volumes:
      # 左侧为宿主机上的二进制文件路径，右侧为容器内挂载路径（只读）
      - ./build/typescript-demo-linux-arm64:/app/app:ro
    command: ["/app/app"]
