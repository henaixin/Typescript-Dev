version: "3.9"

# ================================================================
# 使用说明：
#   1. 首次使用前，需加载对应架构的预构建镜像：
#      - x86_64 架构：docker load -i env/typescript-demo-linux-amd64.tar
#      - ARM64  架构：docker load -i env/typescript-demo-linux-arm64.tar
#   2. 根据宿主机架构选择对应的 profile 启动：
#      - x86_64 架构：docker compose --profile x64 up
#      - ARM64  架构：docker compose --profile arm64 up
#   3. 如需修改时区、容器名等，直接编辑本文件对应字段
# ================================================================

x-common: &common
  container_name: typescript-demo
  restart: always
  stdin_open: true   # 对应 -i，保持 stdin 打开（程序需要读取键盘输入）
  tty: true          # 对应 -t，分配伪终端
  working_dir: /app
  volumes:
    - ./bin:/app      # 将宿主机 bin/ 目录映射到容器 /app
    - ./config.toml:/app/config.toml:ro  # 将配置文件映射到容器，设置为只读
  environment:
    - TZ=Asia/Shanghai
  # 如需暴露端口（程序未来扩展网络功能时），取消下面注释并修改端口号：
  # ports:
  #   - "3000:3000"

services:
  # ========================================================
  # Profile: x64（x86_64 架构：Intel/AMD CPU 的 Linux/Mac/Windows）
  # 用法：docker compose --profile x64 up
  # 镜像来源：env/typescript-demo-linux-amd64.tar
  # 可执行文件路径：bin/typescript-demo-linux-amd64
  # ========================================================
  app-x64:
    <<: *common
    image: typescript-demo:linux-amd64
    command: /app/typescript-demo-linux-amd64
    profiles:
      - x64

  # ========================================================
  # Profile: arm64（ARM64 架构：Apple Silicon Mac、树莓派、ARM 服务器等）
  # 用法：docker compose --profile arm64 up
  # 镜像来源：env/typescript-demo-linux-arm64.tar
  # 可执行文件路径：bin/typescript-demo-linux-arm64
  # ========================================================
  app-arm64:
    <<: *common
    image: typescript-demo:linux-arm64
    command: /app/typescript-demo-linux-arm64
    profiles:
      - arm64
