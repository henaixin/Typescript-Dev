name: Build Multi-Platform Binaries

on:
  push:
    branches: [ main, refresh-camame ]
  pull_request:
    branches: [ main, refresh-camame ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            pkg-target: node18-linux-x64
            output: typescript-demo-linux-x64
          - os: ubuntu-latest
            target: linux-arm64
            pkg-target: node18-linux-arm64
            output: typescript-demo-linux-arm64
          - os: windows-latest
            target: win-x64
            pkg-target: node18-win-x64
            output: typescript-demo-win-x64.exe
          - os: macos-latest
            target: macos-arm64
            pkg-target: node18-macos-arm64
            output: typescript-demo-macos-arm64

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build

    - name: Verify build output (Linux/macOS)
      if: runner.os != 'Windows'
      run: ls -la dist/
      
    - name: Verify build output (Windows)
      if: runner.os == 'Windows'
      run: dir dist\

    - name: Create directories (Linux/macOS)
      if: runner.os != 'Windows'
      run: mkdir -p build .pkg-cache
      
    - name: Create directories (Windows)
      if: runner.os == 'Windows'
      run: New-Item -ItemType Directory -Path build, .pkg-cache -Force

    - name: Package for ${{ matrix.target }} (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        export PKG_CACHE_PATH=$(pwd)/.pkg-cache
        echo "PKG_CACHE_PATH=$PKG_CACHE_PATH"
        npx pkg@latest . --targets ${{ matrix.pkg-target }} --output build/${{ matrix.output }}

    - name: Package for ${{ matrix.target }} (Windows)
      if: runner.os == 'Windows'
      run: |
        $env:PKG_CACHE_PATH = "$PWD\.pkg-cache"
        Write-Host "PKG_CACHE_PATH=$env:PKG_CACHE_PATH"
        npx pkg@latest . --targets ${{ matrix.pkg-target }} --output "build\${{ matrix.output }}"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.target }}
        path: build/${{ matrix.output }}
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: build
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/build-linux-x64/typescript-demo-linux-x64
          build/build-linux-arm64/typescript-demo-linux-arm64
          build/build-win-x64/typescript-demo-win-x64.exe
          build/build-macos-arm64/typescript-demo-macos-arm64
        generate_release_notes: true
