name: Build Multi-Platform Binaries

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            pkg-target: node18-linux-x64
            output: typescript-demo-linux-x64
          - os: ubuntu-latest
            target: linux-arm64
            pkg-target: node18-linux-arm64
            output: typescript-demo-linux-arm64
          - os: windows-latest
            target: win-x64
            pkg-target: node18-win-x64
            output: typescript-demo-win-x64.exe
          - os: macos-latest
            target: macos-arm64
            pkg-target: node18-macos-arm64
            output: typescript-demo-macos-arm64

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      
    - name: List dependencies
      run: npm list

    - name: Build TypeScript
      run: npm run build

    - name: Verify build output
      run: ls -la dist/

    - name: Create build directory
      run: mkdir -p build

    - name: Create pkg cache directory
      run: mkdir -p .pkg-cache

    - name: Check pkg version
      run: npx pkg --version

    - name: Set PKG_CACHE_PATH (Linux/macOS)
      if: runner.os != 'Windows'
      run: echo "PKG_CACHE_PATH=$(pwd)/.pkg-cache" >> $GITHUB_ENV
      
    - name: Set PKG_CACHE_PATH (Windows)
      if: runner.os == 'Windows'
      run: echo "PKG_CACHE_PATH=$(pwd)/.pkg-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      
    - name: Package for ${{ matrix.target }}
      run: |
        echo "PKG_CACHE_PATH=$PKG_CACHE_PATH"
        npx pkg . --targets ${{ matrix.pkg-target }} --output build/${{ matrix.output }} --debug

    - name: Verify package output
      run: ls -la build/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.target }}
        path: build/${{ matrix.output }}
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: build
    
    - name: List build files
      run: ls -la build/
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/build-linux-x64/typescript-demo-linux-x64
          build/build-linux-arm64/typescript-demo-linux-arm64
          build/build-win-x64/typescript-demo-win-x64.exe
          build/build-macos-arm64/typescript-demo-macos-arm64
        generate_release_notes: true
